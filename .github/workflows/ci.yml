name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: JavaScript checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find account tracker money shared scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Run JavaScript tests
        run: >-
          node --test
          tracker/scheduler.test.js
          tracker/fairway-events.test.js
          shared/profile-discovery.test.mjs
          money/calculations.test.js
